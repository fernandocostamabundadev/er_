<!-- ============================================
     PARTIAL / HEADER
     Navegação principal fixa
     ============================================ -->

<header class="header" id="header">
  <nav class="nav" aria-label="Navegação principal">
    <div class="nav__container container">
      <!-- LOGO -->
      <a href="#hero" class="nav__logo" aria-label="Nova Geração — Início">
        <span>NOVA GERAÇÃO</span>
      </a>

      <!-- BOTÃO ABRIR (mobile) -->
      <button
        type="button"
        class="nav__toggle"
        id="nav-toggle"
        aria-label="Abrir menu"
        aria-controls="nav-menu"
        aria-expanded="false"
      >
        <i class="ri-menu-line" aria-hidden="true"></i>
      </button>

      <!-- MENU -->
      <button
        type="button"
        class="nav__backdrop"
        data-nav-backdrop
        aria-label="Fechar menu"
        tabindex="-1"
        hidden
      ></button>
      <div class="nav__menu" id="nav-menu" aria-hidden="true" inert>
        <button
          type="button"
          class="nav__close"
          id="nav-close"
          aria-label="Fechar menu"
        >
          <i class="ri-close-line" aria-hidden="true"></i>
        </button>

        <ul class="nav__list" role="list">
          <li class="nav__item">
            <a href="#hero" class="nav__link">Início</a>
          </li>
          <li class="nav__item">
            <a href="#about" class="nav__link">Sobre</a>
          </li>
          <li class="nav__item">
            <a href="#services" class="nav__link">Serviços</a>
          </li>
          <li class="nav__item">
            <a href="#classes" class="nav__link">Classes</a>
          </li>
          <li class="nav__item">
            <a href="#team" class="nav__link">Equipa</a>
          </li>
          <li class="nav__item">
            <a href="#testimonials" class="nav__link">Depoimentos</a>
          </li>
          <li class="nav__item">
            <a href="#contact" class="nav__link nav__link--contact">Contacto</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
