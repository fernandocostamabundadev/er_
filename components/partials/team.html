<section class="team section" id="team" aria-labelledby="team-title">
  <div class="team__container container">
    <!-- CABEÇALHO DA SECÇÃO -->
    <header class="section__header">
      <span class="section__subtitle">Nossa Equipa</span>
      <h2 class="section__title" id="team-title">
        PROFESSORES <span>ESPECIALIZADOS</span>

    <ul class="team__grid" role="list">
      <!-- PROFESSOR 1 -->
      <li>

              loading="lazy"

      <!-- PROFESSOR 2 -->
