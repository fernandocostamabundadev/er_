<!-- ============================================
     PARTIAL / TEAM
     Equipa de professores do Centro Nova Geração
     ============================================ -->

<section class="team section" id="team" aria-labelledby="team-title">
  <div class="team__container container">
    <!-- CABEÇALHO DA SECÇÃO -->
    <header class="section__header">
      <span class="section__subtitle">Nossa Equipa</span>
      <h2 class="section__title" id="team-title">
        PROFESSORES <span>ESPECIALIZADOS</span>
      </h2>
      <p class="section__description">
        Conheça os professores que acompanham cada aluno com dedicação,
        experiência e atenção personalizada.
      </p>
    </header>

    <!-- GRID DE PROFESSORES -->
    <ul class="team__grid" role="list">
      <!-- PROFESSOR 1 -->
      <li>
        <article class="team__member">
          <figure class="team__member-image">
            <picture>
              <!-- Temporário: substituir por components/assets/img/team/eliza-zandamela.webp -->
              <source
                srcset="./components/assets/img/hero/hero-bg.webp"
                type="image/webp"
              />
              <img
                src="./components/assets/img/hero/hero-bg.webp"
                alt="Eliza Zandamela, professora de Matemática"
                loading="lazy"
                decoding="async"
                width="400"
                height="400"
              />
            </picture>
          </figure>

          <div class="team__member-info">
            <h3 class="team__member-name">Eliza Zandamela</h3>
            <span class="team__member-role">Matemática</span>
          </div>
        </article>
      </li>
